name: Check atlas and publish Pages on request
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run build
      - name: Prepare site with an offline edition
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir _pages
          cp -R site/. _pages/
          cp dist/critical-atlas.html _pages/offline.html
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          for path in (Path('_pages/index.html'), Path('_pages/offline.html')):
              html = path.read_text()
              html = html.replace('name="atlas-repository" content=""', 'name="atlas-repository" content="https://github.com/' + os.environ['GITHUB_REPOSITORY'] + '"')
              path.write_text(html)
          PYTHON
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          path: _pages

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: publish
        uses: actions/deploy-pages@v4
