name: Check atlas and publish Pages on request
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run build
      - name: Prepare site with an offline edition
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir _pages
          cp -R site/. _pages/
          cp dist/riemann-hypothesis-atlas.html _pages/offline.html
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          repository = os.environ['GITHUB_REPOSITORY']
          owner, name = repository.split('/')
          hostname = owner.lower() + '.github.io'
          pages_url = 'https://' + hostname + '/' + ('' if name.lower() == hostname else name + '/')
          for path in (Path('_pages/index.html'), Path('_pages/tour/index.html'), Path('_pages/offline.html')):
              html = path.read_text()
              html = html.replace('https://yiweiivy.github.io/riemann-hypothesis-atlas/', pages_url)
              html = html.replace('https://github.com/YiweiIvy/riemann-hypothesis-atlas', 'https://github.com/' + repository)
              path.write_text(html)
          PYTHON
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          path: _pages

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: publish
        uses: actions/deploy-pages@v4
