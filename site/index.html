<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#090c16" />
    <meta name="atlas-repository" content="https://github.com/YiweiIvy/riemann-hypothesis-atlas" />
    <title>Riemann Hypothesis Atlas</title>
    <meta
      name="description"
      content="Explore 804,912 Lean declarations and 7,917,157 references in Levent Alpöge’s Riemann hypothesis proof claim. Trace a path to its source and replay the proof checks."
    />
    <link
      rel="canonical"
      href="https://yiweiivy.github.io/riemann-hypothesis-atlas/"
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Riemann Hypothesis Atlas" />
    <meta
      property="og:url"
      content="https://yiweiivy.github.io/riemann-hypothesis-atlas/"
    />
    <meta property="og:title" content="Riemann Hypothesis Atlas" />
    <meta
      property="og:description"
      content="Explore 804,912 Lean declarations and 7,917,157 references in Levent Alpöge’s Riemann hypothesis proof claim. Trace a path to its source and replay the proof checks."
    />
    <meta
      property="og:image"
      content="https://yiweiivy.github.io/riemann-hypothesis-atlas/share/riemann-hypothesis-atlas.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A galaxy of Lean dependencies from the Riemann Hypothesis Atlas"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image:alt"
      content="A galaxy of Lean dependencies from the Riemann Hypothesis Atlas"
    />
    <link rel="icon" href="mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="galaxy.css" />
    <link rel="stylesheet" href="code-view.css" />
    <link rel="stylesheet" href="ledger.css" />
    <link rel="stylesheet" href="share/share.css" />
  </head>
  <body>
    <a class="skip" href="#work">Skip to workspace</a>
    <header class="mast">
      <div class="topframe">
        <a href="#map" class="brand"
          ><img src="mark.svg" alt="" /><strong
            >Riemann Hypothesis Atlas</strong
          ></a
        >
        <nav aria-label="Workspace">
          <a href="#map" data-page="map">Explorer</a
          ><a href="#code" data-page="code">Source index</a
          ><a href="#ledger" data-page="ledger">Evidence</a
          ><a href="#sources" data-page="sources">Sources</a>
        </nav>
        <button class="source-stamp" data-action="sources">
          <span></span>Pinned snapshot
        </button>
        <button
          class="nav-help icon-button"
          data-action="guide"
          title="Controls and reading guide"
          aria-label="Controls and reading guide"
        >
          ?
        </button>
      </div>
    </header>
    <main id="work" tabindex="-1" class="frame">
      <div id="workspace" aria-busy="true">
        <div class="loading">Loading proof graph…</div>
      </div>
      <noscript
        >This atlas requires JavaScript. Read the
        <a href="https://alpo.ge/remark.pdf">original announcement</a> or the
        <a href="https://math.mit.edu/~drew/grh/">independent check logs</a
        >.</noscript
      >
    </main>
    <footer class="frame foot">
      <span
        >Riemann Hypothesis Atlas <span class="foot-slash">/</span> Alpöge
        archive</span
      ><a class="tour-link" href="./tour/">Watch the walkthrough</a>
      <button data-action="contribute">Contribute a review ↗</button
      ><span class="foot-date">Snapshot · 21 Nov 2026</span>
    </footer>
    <dialog id="dialog"><div id="dialog-body"></div></dialog>
    <div id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="app.mjs"></script>
  </body>
</html>
